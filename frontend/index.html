<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>FocusDial - Deep Work Journal</title>

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/icon-16.png" />
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0B0B0D" />
    <!-- Without this, adding the app to an iOS home screen just makes a
         bookmark that opens in ordinary Safari (with its address bar and
         chrome) rather than the standalone window manifest.webmanifest's
         "display": "standalone" already asks for on Android/Chrome - and
         critically, the `display-mode: standalone` CSS media query
         App.css's long-press-selection lock relies on isn't reliably set
         without it either. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />

  </body>
